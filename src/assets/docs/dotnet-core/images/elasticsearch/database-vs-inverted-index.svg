<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">So sánh database search và Elasticsearch inverted index</title>
  <desc id="desc">Bên trái, truy vấn chứa ký tự đại diện kiểm tra nhiều dòng trong database. Bên phải, Elasticsearch phân tích từ khóa thành term rồi tra trực tiếp các document liên quan trong inverted index.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="elastic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <text x="60" y="66" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Hai cách tìm “gà cay”</text>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="17" fill="#64748b">Cùng dữ liệu món ăn, nhưng cấu trúc tra cứu phục vụ hai loại công việc khác nhau</text>

  <g filter="url(#shadow)">
    <rect x="55" y="135" width="520" height="480" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="625" y="135" width="520" height="480" rx="24" fill="#ffffff" stroke="#fed7aa"/>
  </g>

  <circle cx="93" cy="177" r="18" fill="#e2e8f0"/>
  <text x="93" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">1</text>
  <text x="124" y="184" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Database search</text>
  <rect x="85" y="215" width="460" height="54" rx="12" fill="#f1f5f9"/>
  <text x="315" y="248" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#475569">LIKE '%gà cay%'</text>

  <path d="M315 278 L315 315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="92" y="330" width="446" height="52" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <circle cx="119" cy="356" r="9" fill="#f97316"/>
    <text x="142" y="362" fill="#334155">Gà rán sốt cay</text>
    <text x="500" y="362" text-anchor="end" fill="#c2410c">kiểm tra</text>

    <rect x="92" y="392" width="446" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="119" cy="418" r="9" fill="#94a3b8"/>
    <text x="142" y="424" fill="#334155">Cơm gà Hải Nam</text>
    <text x="500" y="424" text-anchor="end" fill="#64748b">kiểm tra</text>

    <rect x="92" y="454" width="446" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="119" cy="480" r="9" fill="#94a3b8"/>
    <text x="142" y="486" fill="#334155">Mì bò sốt cay</text>
    <text x="500" y="486" text-anchor="end" fill="#64748b">kiểm tra</text>
  </g>
  <rect x="92" y="535" width="446" height="50" rx="12" fill="#fef2f2"/>
  <text x="315" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">Chi phí tăng theo số row phải kiểm tra</text>

  <circle cx="663" cy="177" r="18" fill="url(#elastic)"/>
  <text x="663" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="694" y="184" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Elasticsearch</text>
  <rect x="655" y="215" width="460" height="54" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="885" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#9a3412">Analyzer → [ gà ] [ cay ]</text>

  <path d="M885 278 L885 315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="686" y="342" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">INVERTED INDEX</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="667" y="357" width="198" height="66" rx="12" fill="#fffbeb" stroke="#fbbf24"/>
    <text x="690" y="386" font-weight="700" fill="#92400e">gà</text>
    <text x="690" y="410" fill="#475569">→ document 1, 2</text>
    <rect x="905" y="357" width="198" height="66" rx="12" fill="#fff1f2" stroke="#fb7185"/>
    <text x="928" y="386" font-weight="700" fill="#9f1239">cay</text>
    <text x="928" y="410" fill="#475569">→ document 1, 3</text>
  </g>

  <path d="M766 435 C766 480 885 466 885 510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1004 435 C1004 480 885 466 885 510" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="667" y="522" width="436" height="63" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <circle cx="704" cy="553" r="18" fill="#10b981"/>
  <path d="M696 553 l6 6 11 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="735" y="549" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#065f46">Document 1: Gà rán sốt cay</text>
  <text x="735" y="572" font-family="Arial, sans-serif" font-size="14" fill="#047857">Tra term trước, sau đó tính relevance</text>
</svg>
